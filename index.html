<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CPA Lineup Builder</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #ffffff; --bg2: #f5f5f4; --bg3: #eeede9;
  --text: #1a1a18; --text2: #6b6b67; --text3: #9a9a96;
  --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
  --radius: 8px; --radius-lg: 12px;
  --green-bg: #EAF3DE; --green: #3B6D11; --green-border: #639922;
  --blue-bg:  #E6F1FB; --blue:  #185FA5; --blue-border:  #378ADD;
  --amber-bg: #FAEEDA; --amber: #854F0B; --amber-border: #BA7517;
  --red-bg:   #FCEBEB; --red:   #A32D2D; --red-border:   #E24B4A;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1a; --bg2: #252522; --bg3: #2e2e2b;
    --text: #f0f0ec; --text2: #9a9a96; --text3: #6b6b67;
    --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
    --green-bg: #172d0a; --green: #a0d060; --green-border: #3B6D11;
    --blue-bg:  #0d2540; --blue:  #85b7eb; --blue-border:  #185FA5;
    --amber-bg: #2d1f06; --amber: #efaa50; --amber-border: #854F0B;
    --red-bg:   #2d0d0d; --red:   #f09595; --red-border:   #A32D2D;
  }
}
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; color: var(--text); background: var(--bg3); min-height: 100vh; }
#app  { max-width: 820px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

/* header */
.header { margin-bottom: 1.25rem; }
.header h1 { font-size: 20px; font-weight: 600; }
.header p  { font-size: 12px; color: var(--text2); margin-top: 2px; }

/* stat cards */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
.stat-card { background: var(--bg2); border-radius: var(--radius); padding: 10px 13px; }
.stat-card .sv { font-size: 22px; font-weight: 600; }
.stat-card .sl { font-size: 12px; color: var(--text2); margin-top: 2px; }

/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 1.25rem; }
.tab  { padding: 7px 14px; font-size: 13px; background: none; border: none; cursor: pointer; color: var(--text2); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s; font-family: inherit; }
.tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 500; }
.tab:hover:not(.active) { color: var(--text); }

/* section card */
.section { padding: 0.85rem 1rem; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--bg); margin-bottom: 0.85rem; }

/* labels */
.label { font-size: 11px; color: var(--text2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }

/* rows */
.row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: none; }

/* buttons */
.btn { padding: 5px 11px; font-size: 12px; border: 1px solid var(--border2); border-radius: var(--radius); background: var(--bg2); cursor: pointer; color: var(--text); white-space: nowrap; transition: background .12s; font-family: inherit; }
.btn:hover  { background: var(--bg3); }
.btn.danger { border-color: var(--red-border); color: var(--red); }
.btn.danger:hover { background: var(--red-bg); }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn.primary:hover { opacity: .85; }
.btn.green { background: var(--green-bg); border-color: var(--green-border); color: var(--green); }
.btn.sm { padding: 3px 8px; font-size: 11px; }

/* availability pills */
.avail-btn { padding: 5px 11px; font-size: 12px; border-radius: 20px; border: 1px solid var(--border2); background: var(--bg2); cursor: pointer; color: var(--text2); transition: all .12s; white-space: nowrap; font-family: inherit; }
.avail-btn.sel-both  { background: var(--green-bg); border-color: var(--green-border); color: var(--green); }
.avail-btn.sel-eight { background: var(--blue-bg);  border-color: var(--blue-border);  color: var(--blue); }
.avail-btn.sel-nine  { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber); }
.avail-btn.sel-out   { background: var(--red-bg);   border-color: var(--red-border);   color: var(--red); }

/* lineup slots */
.slot { display: flex; align-items: center; gap: 6px; padding: 6px 9px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 4px; background: var(--bg2); font-size: 12px; }
.slot.empty { border-style: dashed; color: var(--text3); justify-content: center; min-height: 32px; }

/* cap bar */
.cap-bar  { height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; margin: 5px 0; }
.cap-fill { height: 100%; border-radius: 3px; transition: width .2s; }
.cap-ok   { background: var(--green-border); }
.cap-warn { background: var(--amber-border); }
.cap-over { background: var(--red-border); }
.cap-label { font-size: 11px; color: var(--text2); }

/* picker rows */
.pick-row { display: flex; align-items: center; gap: 6px; padding: 5px 7px; border-radius: var(--radius); cursor: pointer; transition: background .1s; font-size: 12px; }
.pick-row:hover { background: var(--bg2); }
.pick-row.in-lineup { opacity: .4; cursor: default; pointer-events: none; }

/* two-column lineup layout */
.two-col   { display: flex; gap: 12px; flex-wrap: wrap; }
.lineup-col { flex: 1; min-width: 200px; }

/* badges */
.badge       { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
.badge.green { background: var(--green-bg); color: var(--green); }
.badge.blue  { background: var(--blue-bg);  color: var(--blue); }
.badge.amber { background: var(--amber-bg); color: var(--amber); }
.badge.red   { background: var(--red-bg);   color: var(--red); }

/* win pill */
.win-pill { display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 10px; font-weight: 600; min-width: 34px; text-align: center; }

/* share preview */
.preview-box { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; font-family: "SF Mono","Fira Code","Consolas",monospace; font-size: 12.5px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }

/* roster table */
.roster-table    { width: 100%; border-collapse: collapse; font-size: 12px; }
.roster-table th { text-align: left; font-size: 11px; color: var(--text2); font-weight: 500; padding: 4px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.roster-table td { padding: 7px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.roster-table tr:last-child td { border-bottom: none; }

/* forms */
.form-group  { display: flex; flex-direction: column; gap: 3px; }
.form-label  { font-size: 11px; color: var(--text2); }
input[type=text], input[type=number], input[type=date] { padding: 6px 9px; font-size: 13px; border: 1px solid var(--border2); border-radius: var(--radius); background: var(--bg); color: var(--text); width: 100%; font-family: inherit; }
input:focus { outline: none; border-color: var(--text2); }

/* misc */
.settings-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 0.85rem; margin-bottom: 0.85rem; border-bottom: 1px solid var(--border); font-size: 13px; }
.empty-state  { text-align: center; padding: 2rem; color: var(--text2); font-size: 13px; }
.info-note    { font-size: 11px; color: var(--text2); padding: 6px 10px; background: var(--bg2); border-radius: var(--radius); border-left: 3px solid var(--border2); }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>🎱 CPA Lineup Builder</h1>
    <p>Roster · availability · lineups · WhatsApp export</p>
  </div>

  <div class="stat-grid">
    <div class="stat-card"><div class="sv" id="sc-players">—</div><div class="sl">Registered players</div></div>
    <div class="stat-card"><div class="sv" id="sc-avail">—</div><div class="sl">Available this week</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="setTab('roster')">Roster</button>
    <button class="tab" onclick="setTab('week')">This Week</button>
    <button class="tab" onclick="setTab('lineup')">Lineup</button>
    <button class="tab" onclick="setTab('share')">Share</button>
  </div>

  <div id="tab-content"></div>

  <div style="margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border);font-size:11px;color:var(--text3);text-align:center">
    Availability &amp; lineup auto-saved · Roster loaded fresh from roster.json on every visit
  </div>
</div>

<script>
// ─── STATE ────────────────────────────────────────────────────────────────────
// players:   loaded fresh from roster.json on every page load — never cached
// avail/lineup/settings: persisted to localStorage so they survive refresh
const S = {
  players:   [],
  avail:     {},      // { playerId: 'both'|'eight'|'nine'|'out' }
  lineup8:   [],      // [ playerId, ... ]  (8-ball lineup)
  lineup9:   [],      // [ playerId, ... ]  (9-ball lineup)
  cap:       23,
  teamSize:  5,
  opponent:  '',
  matchDate: '',
  venue:     '',
  tab:       'roster',
};

// ─── PERSISTENCE ─────────────────────────────────────────────────────────────
const PERSIST_KEYS = ['avail','lineup8','lineup9','cap','teamSize','opponent','matchDate','venue'];

function loadState() {
  PERSIST_KEYS.forEach(k => {
    try {
      const v = localStorage.getItem('cpa_' + k);
      if (v !== null) S[k] = JSON.parse(v);
    } catch {}
  });
}

function saveState() {
  PERSIST_KEYS.forEach(k => {
    try { localStorage.setItem('cpa_' + k, JSON.stringify(S[k])); } catch {}
  });
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function pct(w, g) { return g > 0 ? Math.round(w / g * 100) : 0; }

function winPillHTML(w, g) {
  const p  = pct(w, g);
  const bg = p >= 60 ? 'var(--green-bg)' : p >= 40 ? 'var(--amber-bg)' : 'var(--red-bg)';
  const c  = p >= 60 ? 'var(--green)'    : p >= 40 ? 'var(--amber)'    : 'var(--red)';
  return `<span class="win-pill" style="background:${bg};color:${c}">${w}/${g}</span>`;
}

function pctColour(p) {
  return p >= 60 ? 'var(--green)' : p >= 40 ? 'var(--amber)' : 'var(--red)';
}

function capBarHTML(total, cap) {
  const p   = Math.min(100, (total / cap) * 100);
  const cls = total > cap ? 'cap-over' : total >= cap - 2 ? 'cap-warn' : 'cap-ok';
  const c   = total > cap ? 'var(--red)' : total >= cap - 2 ? 'var(--amber)' : 'inherit';
  return `<div class="cap-bar"><div class="cap-fill ${cls}" style="width:${p}%"></div></div>
          <div class="cap-label">Total: <strong style="color:${c}">${total}</strong> / ${cap} cap</div>`;
}

function ballSVG(fmt) {
  if (fmt === '8') return `<svg width="22" height="22" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;margin-right:6px;flex-shrink:0"><circle cx="11" cy="11" r="10.5" fill="#1a1a1a" stroke="#000" stroke-width="0.5"/><circle cx="11" cy="11" r="5.5" fill="white"/><text x="11" y="15" text-anchor="middle" font-size="7" font-weight="700" font-family="-apple-system,sans-serif" fill="#1a1a1a">8</text></svg>`;
  return `<svg width="22" height="22" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;margin-right:6px;flex-shrink:0"><circle cx="11" cy="11" r="10.5" fill="#f5c400" stroke="#c8960a" stroke-width="0.5"/><circle cx="11" cy="11" r="5.5" fill="white"/><text x="11" y="15" text-anchor="middle" font-size="7" font-weight="700" font-family="-apple-system,sans-serif" fill="#1a1a1a">9</text></svg>`;
}

function fmtDate(d) {
  if (!d) return '';
  const [y, m, dd] = d.split('-');
  return `${parseInt(dd)} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(m)-1]} ${y}`;
}

function calcTotal(lu, fmt) {
  return lu.reduce((s, id) => {
    const p = S.players.find(x => x.id === id);
    return s + (p ? (fmt === '8' ? p.h8 : p.h9) : 0);
  }, 0);
}

function avail8(p) { const v = S.avail[p.id]; return v === 'eight' || v === 'both'; }
function avail9(p) { const v = S.avail[p.id]; return v === 'nine'  || v === 'both'; }

// ─── STAT CARDS + TAB HIGHLIGHTS ─────────────────────────────────────────────
function updateChrome() {
  document.getElementById('sc-players').textContent = S.players.length;
  document.getElementById('sc-avail').textContent   = S.players.filter(p => S.avail[p.id] && S.avail[p.id] !== 'out').length;

  const tabNames = ['roster','week','lineup','share'];
  document.querySelectorAll('.tab').forEach((el, i) => el.classList.toggle('active', tabNames[i] === S.tab));
}

// ─── RENDER: ROSTER ──────────────────────────────────────────────────────────
function renderRoster() {
  if (!S.players.length) return `<div class="empty-state">Loading roster…</div>`;

  const rows = S.players.map(p => {
    const p8 = pct(p.w8, p.g8), p9 = pct(p.w9, p.g9);
    return `<tr>
      <td style="font-weight:600">${esc(p.name)}</td>
      <td style="font-weight:600">${p.h8}</td>
      <td>${winPillHTML(p.w8, p.g8)}</td>
      <td style="color:${pctColour(p8)};font-weight:600">${p8}%</td>
      <td style="font-weight:600">${p.h9}</td>
      <td>${winPillHTML(p.w9, p.g9)}</td>
      <td style="color:${pctColour(p9)};font-weight:600">${p9}%</td>
    </tr>`;
  }).join('');

  return `
    <div class="section">
      <div class="settings-row">
        <span style="color:var(--text2)">Team size:</span>
        <input type="number" min="1" max="9" value="${S.teamSize}" onchange="setSetting('teamSize',+this.value)" style="width:50px"/>
        <span style="color:var(--text2)">Handicap cap:</span>
        <input type="number" min="1" max="99" value="${S.cap}" onchange="setSetting('cap',+this.value)" style="width:60px"/>
      </div>
      <div style="overflow-x:auto">
        <table class="roster-table">
          <thead><tr>
            <th>Player</th>
            <th>8-ball SL</th><th>W/G</th><th>%</th>
            <th>9-ball SL</th><th>W/G</th><th>%</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="info-note" style="margin-top:0.75rem">
        Edit <strong>roster.json</strong> to update skill levels and stats — changes appear automatically on next page load.
      </div>
    </div>`;
}

// ─── RENDER: THIS WEEK ───────────────────────────────────────────────────────
function renderWeek() {
  if (!S.players.length) return `<div class="empty-state">Roster not yet loaded</div>`;

  const rows = S.players.map(p => {
    const v = S.avail[p.id] || 'out';
    const btns = [['both','Both','sel-both'],['eight','8-ball','sel-eight'],['nine','9-ball','sel-nine'],['out','Out','sel-out']]
      .map(([av, lbl, cls]) => `<button class="avail-btn${v===av?' '+cls:''}" onclick="setAvail('${p.id}','${av}')">${lbl}</button>`)
      .join('');
    return `<div class="row">
      <div style="flex:1">
        <div style="font-weight:600;font-size:13px">${esc(p.name)}</div>
        <div style="font-size:11px;color:var(--text2);margin-top:1px">
          8-ball SL ${p.h8} · ${pct(p.w8,p.g8)}% &nbsp;|&nbsp; 9-ball SL ${p.h9} · ${pct(p.w9,p.g9)}%
        </div>
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">${btns}</div>
    </div>`;
  }).join('');

  const badges = [['both','Both games','green'],['eight','8-ball only','blue'],['nine','9-ball only','amber'],['out','Not available','red']]
    .map(([v, lbl, cls]) => {
      const n = S.players.filter(p => (S.avail[p.id]||'out') === v).length;
      return n > 0 ? `<span class="badge ${cls}">${n} — ${lbl}</span>` : '';
    }).join('');

  return `
    <div class="section">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.6rem">
        <div class="label">Set each player's availability</div>
        <button class="btn sm" onclick="clearWeek()">Reset week</button>
      </div>
      ${rows}
    </div>
    <div class="section">
      <div class="label" style="margin-bottom:8px">Summary</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${badges || '<span style="color:var(--text2);font-size:12px">No availability set yet</span>'}
      </div>
    </div>`;
}

// ─── RENDER: LINEUP (one column) ─────────────────────────────────────────────
function renderLineupCol(fmt) {
  const lu    = fmt === '8' ? S.lineup8 : S.lineup9;
  const avFn  = fmt === '8' ? avail8    : avail9;
  const label = fmt === '8' ? '8-ball'  : '9-ball';
  const total = calcTotal(lu, fmt);
  const full  = lu.length >= S.teamSize;

  const filled = lu.map((id, i) => {
    const p = S.players.find(x => x.id === id); if (!p) return '';
    const hc = fmt==='8'?p.h8:p.h9, w=fmt==='8'?p.w8:p.w9, g=fmt==='8'?p.g8:p.g9;
    return `<div class="slot">
      <span style="font-size:10px;color:var(--text3);min-width:12px">${i+1}</span>
      <span style="flex:1;font-weight:600">${esc(p.name)}</span>
      <span style="font-size:11px;color:var(--text2)">SL ${hc}</span>
      ${winPillHTML(w, g)}
      <button class="btn sm danger" onclick="toggleLineup('${fmt}','${p.id}')" style="padding:2px 6px;font-size:10px">✕</button>
    </div>`;
  }).join('');

  const empties = Array.from({length: S.teamSize - lu.length})
    .map(() => `<div class="slot empty">— open slot —</div>`).join('');

  const available = S.players.filter(avFn);
  const picks = available.length === 0
    ? `<div style="font-size:12px;color:var(--text2);padding:6px 0">No players marked available for ${label} — set availability first</div>`
    : available.map(p => {
        const hc=fmt==='8'?p.h8:p.h9, w=fmt==='8'?p.w8:p.w9, g=fmt==='8'?p.g8:p.g9;
        const inL = lu.includes(p.id);
        return `<div class="pick-row${inL?' in-lineup':''}" onclick="toggleLineup('${fmt}','${p.id}')">
          <span style="flex:1;font-weight:600">${esc(p.name)}</span>
          <span style="font-size:11px;color:var(--text2);margin-right:4px">SL ${hc}</span>
          ${winPillHTML(w, g)}
          ${inL ? `<span style="font-size:10px;color:var(--green);margin-left:4px">✓</span>` : ''}
        </div>`;
      }).join('');

  return `<div class="lineup-col"><div class="section">
    <div style="font-size:14px;font-weight:600;margin-bottom:8px;display:flex;align-items:center">${ballSVG(fmt)}${label} Lineup</div>
    ${capBarHTML(total, S.cap)}
    <div style="margin-top:10px">${filled}${empties}</div>
    <div style="margin-top:10px">
      <div class="label">${full ? 'Lineup full — remove a player to swap' : 'Tap to add to lineup'}</div>
      ${picks}
    </div>
  </div></div>`;
}

function renderLineup() {
  return `
    <div style="display:flex;gap:8px;margin-bottom:0.85rem;flex-wrap:wrap">
      <button class="btn sm" onclick="clearLineups()">Clear both</button>
      <button class="btn sm" onclick="clearLineup('8')">Clear 8-ball</button>
      <button class="btn sm" onclick="clearLineup('9')">Clear 9-ball</button>
      <button class="btn sm green" onclick="setTab('share')">Share summary →</button>
    </div>
    <div class="two-col">${renderLineupCol('8')}${renderLineupCol('9')}</div>`;
}

// ─── RENDER: SHARE ───────────────────────────────────────────────────────────
function renderShare() {
  const t8 = calcTotal(S.lineup8, '8'), t9 = calcTotal(S.lineup9, '9');
  const inc = S.lineup8.length < S.teamSize || S.lineup9.length < S.teamSize;
  return `
    <div class="section">
      <div class="label" style="margin-bottom:8px">Match details (optional)</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="form-group" style="grid-column:1/-1">
          <div class="form-label">Opponent team name</div>
          <input type="text" placeholder="e.g. The Scratch Artists" value="${esc(S.opponent)}" oninput="setDetail('opponent',this.value)"/>
        </div>
        <div class="form-group">
          <div class="form-label">Match date</div>
          <input type="date" value="${esc(S.matchDate)}" oninput="setDetail('matchDate',this.value)"/>
        </div>
        <div class="form-group">
          <div class="form-label">Venue</div>
          <input type="text" placeholder="e.g. Dooly's Scarborough" value="${esc(S.venue)}" oninput="setDetail('venue',this.value)"/>
        </div>
      </div>
    </div>
    <div class="section">
      <div class="label" style="margin-bottom:8px">WhatsApp message preview</div>
      <div class="preview-box" id="msg-preview">${esc(buildMsg())}</div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:0.85rem">
        <button class="btn green" onclick="doCopy()">Copy to clipboard</button>
        <span id="copy-confirm" style="font-size:12px;color:var(--green);font-weight:600;display:none">Copied — paste straight into WhatsApp ✓</span>
      </div>
      <div style="font-size:11px;color:var(--text2);margin-top:8px">WhatsApp renders *bold* and _italic_ automatically. Paste as-is.</div>
    </div>
    <div class="section">
      <div class="label" style="margin-bottom:6px">Lineup status</div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px">
        <span>8-ball: <strong>${S.lineup8.length}/${S.teamSize}</strong> filled · HC total <strong style="color:${t8>S.cap?'var(--red)':'inherit'}">${t8}/${S.cap}</strong></span>
        <span>9-ball: <strong>${S.lineup9.length}/${S.teamSize}</strong> filled · HC total <strong style="color:${t9>S.cap?'var(--red)':'inherit'}">${t9}/${S.cap}</strong></span>
      </div>
      ${inc ? `<div style="margin-top:6px;font-size:11px;color:var(--amber)">Lineup incomplete — TBD slots will appear in the message.</div>` : ''}
    </div>`;
}

// ─── BUILD WHATSAPP MESSAGE ───────────────────────────────────────────────────
function buildMsg() {
  const lines = ['🎱 *CPA MATCH LINEUP*'];
  if (S.opponent)  lines.push(`vs *${S.opponent}*`);
  if (S.matchDate) lines.push(`📅 ${fmtDate(S.matchDate)}`);
  if (S.venue)     lines.push(`📍 ${S.venue}`);
  lines.push('');

  ['8','9'].forEach(fmt => {
    const lu    = fmt==='8' ? S.lineup8 : S.lineup9;
    const total = calcTotal(lu, fmt);
    lines.push(fmt==='8' ? '*8-BALL LINEUP* ⚫' : '*9-BALL LINEUP* 🟡');
    if (!lu.length) { lines.push('  — not set —'); }
    else {
      lu.forEach((id, i) => {
        const p = S.players.find(x => x.id === id);
        if (p) lines.push(`  ${i+1}. ${p.name}  (SL ${fmt==='8'?p.h8:p.h9} · ${fmt==='8'?p.w8:p.w9}/${fmt==='8'?p.g8:p.g9} wins)`);
      });
      for (let i = lu.length; i < S.teamSize; i++) lines.push(`  ${i+1}. — TBD —`);
      lines.push(`  _Team total: ${total} / ${S.cap}_`);
    }
    lines.push('');
  });

  const sitting = S.players.filter(p =>
    !S.lineup8.includes(p.id) && !S.lineup9.includes(p.id) &&
    S.avail[p.id] && S.avail[p.id] !== 'out'
  );
  if (sitting.length) lines.push(`_Sitting out: ${sitting.map(p=>p.name).join(', ')}_`, '');
  lines.push('Good luck everyone! 🍀');
  return lines.join('\n');
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────────────
function render() {
  updateChrome();
  const el = document.getElementById('tab-content');
  switch (S.tab) {
    case 'roster':  el.innerHTML = renderRoster();  break;
    case 'week':    el.innerHTML = renderWeek();    break;
    case 'lineup':  el.innerHTML = renderLineup();  break;
    case 'share':   el.innerHTML = renderShare();   break;
  }
}

// ─── EVENT HANDLERS ───────────────────────────────────────────────────────────
function setTab(tab)           { S.tab = tab; render(); }
function setSetting(key, val)  { S[key] = val; saveState(); render(); }
function setAvail(id, val)     { S.avail[id] = val; saveState(); render(); }

function clearWeek() {
  S.avail = {}; S.lineup8 = []; S.lineup9 = [];
  saveState(); render();
}

function toggleLineup(fmt, id) {
  const lu  = fmt==='8' ? S.lineup8 : S.lineup9;
  const idx = lu.indexOf(id);
  const next = idx >= 0 ? lu.filter(x => x !== id)
                        : lu.length < S.teamSize ? [...lu, id] : lu;
  if (fmt==='8') S.lineup8 = next; else S.lineup9 = next;
  saveState(); render();
}

function clearLineups()      { S.lineup8=[]; S.lineup9=[]; saveState(); render(); }
function clearLineup(fmt)    { if(fmt==='8') S.lineup8=[]; else S.lineup9=[]; saveState(); render(); }

// setDetail uses targeted DOM update to keep input focus while typing
function setDetail(key, val) {
  S[key] = val;
  saveState();
  const preview = document.getElementById('msg-preview');
  if (preview) preview.textContent = buildMsg();
}

function doCopy() {
  const txt = buildMsg();
  const confirm = () => {
    const el = document.getElementById('copy-confirm');
    if (el) { el.style.display = 'inline'; setTimeout(() => { el.style.display = 'none'; }, 2500); }
  };
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(txt).then(confirm).catch(() => legacyCopy(txt, confirm));
  } else {
    legacyCopy(txt, confirm);
  }
}

function legacyCopy(txt, cb) {
  const ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); if (cb) cb(); } catch {}
  document.body.removeChild(ta);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function init() {
  loadState();
  render(); // show loading state immediately while fetch runs

  try {
    // cache:'no-cache' forces revalidation with server on every load
    // so weekly updates to roster.json are always picked up
    const res = await fetch('roster.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    S.players = await res.json();

    // Clean up any stale IDs left in saved state from removed players
    const validIds = new Set(S.players.map(p => p.id));
    S.lineup8 = S.lineup8.filter(id => validIds.has(id));
    S.lineup9 = S.lineup9.filter(id => validIds.has(id));
    Object.keys(S.avail).forEach(id => { if (!validIds.has(id)) delete S.avail[id]; });

  } catch (e) {
    document.getElementById('tab-content').innerHTML = `
      <div class="section" style="border-color:var(--red-border)">
        <div style="color:var(--red);font-weight:600;margin-bottom:6px">⚠ Could not load roster.json</div>
        <div style="font-size:12px;color:var(--text2)">${esc(e.message)}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:4px">Make sure roster.json is in the same folder as index.html in your GitHub repo.</div>
      </div>`;
    return;
  }

  render();
}

init();
</script>

</html>
